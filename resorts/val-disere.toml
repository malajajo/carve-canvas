# Val d'Isère — VIGNETTE: village + La Face de Bellevarde + Solaise
# Intimate diorama scale (~4x5 km) per docs/gap-analysis.md P0.

name = "Val d'Isère"
slug = "val-disere"

[bbox] # tight: village centre, Bellevarde face west, Solaise south-east
west = 6.950
south = 45.418
east = 7.005
north = 45.462

[terrain]
heightmap_size = 320
target_size = 10.0
z_exaggeration = 1.5   # relief is already dominant at this tight scale
camera_distance = 1.15

[style]
smooth_m = 40          # finer features matter at vignette scale
macro_m = 250
detail_gain = 0.65
valley_gamma = 1.15

[staging]
flatten_base = 0.6
peak_amp = 0.4
edge_droop_m = 100
droop_dist_m = 500

[boundary]
buffer_m = 400
smooth_m = 400
simplify_m = 80

[materials]
treeline_m = 2150
treeline_blend_m = 120
rock_slope_deg = 55
rock_blend_deg = 6
outcrop_slope_deg = 44
outcrop_scale = 6.0
outcrop_amount = 0.15  # rock only where it's dramatic; snow stays clean

[features]
piste_radius = 0.012   # subtle; carved grooves carry the runs now
lift_clearance = 0.03
pylon_spacing_m = 250
min_piste_len_m = 200
carve_depth_m = 6      # pistes carved into the snow as groomed runs
carve_width_m = 30

[trees]
density = 1.0
height_m = 22          # near-real: trees are actually visible at this scale
snowy_share = 0.75     # winter: most trees snow-covered

[chalets]
size_m = 14            # near-real footprint

[underside]
depth_frac = 0.18
rings = 14
taper = 0.85
lip_bulge = 0.08
lip_rings = 4
